openapi: 3.0.0
info:
  title: Minha API REST
  version: 0.1
servers:
  - url: http://localhost:3000/
tags:
  - name: usuarios
paths:
  /usuarios:
    post:
      tags:
        - usuarios
      summary: Criação de um novo usuário
      requestBody:
        required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - senha
      responses:
        201:
          description: Usuario criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        422:
          description: Email e Senha são obrigatórios
components:
  schemas:
    Usuario:
      type: object
      properties:
        email:
          type: string
        senha:
          type: string
  securitySchemes:
